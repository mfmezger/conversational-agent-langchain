[project]
name = "agent"
version = "5.5.0"
description = "Conversational Agent that uses Retrieval Augmented Generation to answer questions based on documentation."
authors = [
    { name = "Marc Fabian Mezger", email = "57255687+mfmezger@users.noreply.github.com" }
]
requires-python = ">= 3.13"
readme = "README.md"
dependencies = [
    "ultra-simple-config>=0.1.0",
    "langgraph>=1.2.16",
    "litellm>=1.107.0rc1",
    "fastembed>=0.9.0",
    "arize-phoenix>=20.23.0",
    "openai>=3.35.1",
    "fastapi>=0.144.0",
    "python-dotenv>=1.2.4",
    "langchain-cohere>=0.6.0",
    "omegaconf>=2.4.0",
    "loguru>=0.7.3",
    "tiktoken>=0.14.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "pypdfium2>=5.14.0",
    "uvicorn>=0.54.0",
    "arize-phoenix-otel>=0.17.2",
    "openinference-instrumentation-langchain>=0.1.79",
    "pyfiglet>=1.0.4",
    "langchain-qdrant>=1.1.0",
    "aiofiles>=25.1.0",
    "streamlit>=1.66.0",
    "langchain>=1.4.6",
    "langchain-litellm>=0.11.1",
    "flashrank>=0.2.10",
    "werkzeug>=3.1.9",
]


[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"


[tool.mypy]
disallow_untyped_defs = true
# disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "coverage>=7.16.2",
    "dirty-equals>=0.11",
    "inline-snapshot>=0.36.1",
    "pytest-xdist>=3.8.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.14.0",
    "httpx>=0.28.1",
]

[tool.ty.terminal]
error-on-warning = false

[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-return-type = "warn"
invalid-type-form = "warn"
missing-argument = "warn"
missing-typed-dict-key = "warn"
not-iterable = "warn"
unknown-argument = "warn"
unresolved-attribute = "warn"
unresolved-import = "warn"

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --durations=20"
xfail_strict = true
markers = [
    "unit: pure unit tests",
    "integration: integration tests with in-process dependencies",
    "contract: endpoint contract tests without external network dependencies",
    "e2e: end-to-end tests requiring external services",
    "vcr: tests backed by recorded HTTP interactions",
    "slow: long-running tests",
]
filterwarnings = [
    "ignore:`json_encoders` is deprecated:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20"
]
